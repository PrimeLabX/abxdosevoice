<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抗生剤投与量 計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./data.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 font-sans">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
    <div class="bg-blue-600 px-6 py-4">
      <h1 class="text-white text-xl font-bold">抗生剤投与量 計算ツール</h1>
    </div>

    <div class="p-6 space-y-6">
      <!-- 上段：音声入力ボタンエリア（テキストエリア撤廃） -->
      <div class="text-center space-y-3">
        <button id="micBtn" type="button" class="w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-base">
          <span id="micIcon" class="text-xl">🎙️</span>
          <span id="micText">タップして音声入力</span>
        </button>
        <!-- 音声認識結果のプレビュー表示 -->
        <p id="transcriptPreview" class="text-xs text-slate-500 min-h-[1.25rem] px-2 truncate">
          ボタンを押して話しかけてください（例：75歳男性 60kg Cre1.2 セファゾリン）
        </p>
      </div>

      <hr class="border-slate-200">

      <!-- 下段：パラメーター確認・修正エリア -->
      <div>
        <h2 class="text-sm font-semibold text-slate-700 mb-4">抽出パラメーター（全項目が揃うと自動計算されます）</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-slate-500 mb-1">年齢 (歳)</label>
            <input type="number" id="age" class="w-full p-2 border border-slate-300 rounded focus:ring-blue-500 trigger-calc">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">性別</label>
            <select id="gender" class="w-full p-2 border border-slate-300 rounded focus:ring-blue-500 trigger-calc">
              <option value="">未選択</option>
              <option value="male">男性</option>
              <option value="female">女性</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">体重 (kg)</label>
            <input type="number" id="weight" step="0.1" class="w-full p-2 border border-slate-300 rounded focus:ring-blue-500 trigger-calc">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">血清Cre (mg/dL)</label>
            <input type="number" id="creatinine" step="0.01" class="w-full p-2 border border-slate-300 rounded focus:ring-blue-500 trigger-calc">
          </div>
          <div class="col-span-2">
            <label class="block text-xs text-slate-500 mb-1">薬剤名（手動修正可）</label>
            <select id="drugSelect" class="w-full p-2 border border-slate-300 rounded focus:ring-blue-500 trigger-calc">
              <option value="">薬剤を選択してください</option>
            </select>
          </div>
        </div>
      </div>

      <div id="errorMessage" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200"></div>

      <!-- 結果表示エリア -->
      <div id="resultArea" class="hidden bg-slate-50 p-6 rounded-lg border border-slate-200 space-y-5 mt-6">
        <div class="flex items-center space-x-3 border-b border-slate-200 pb-4">
          <h3 class="text-sm text-slate-600 font-semibold">推定クレアチニンクリアランス (Ccr)</h3>
          <p class="text-lg font-bold text-slate-800"><span id="resultCcr">0</span> <span class="text-sm font-normal text-slate-600">mL/min</span></p>
        </div>
        
        <div>
          <h4 id="resultDrugName" class="font-bold text-slate-800 text-lg mb-4">薬剤名</h4>
          <div class="space-y-3 text-sm">
            <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3">
              <span class="inline-block px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs font-semibold whitespace-nowrap w-fit">初回(ローディング)</span>
              <span id="resultLoading" class="text-slate-700 py-0.5"></span>
            </div>
            
            <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3">
              <span class="inline-block px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs font-semibold whitespace-nowrap w-fit">維持用量 (Ccr基準)</span>
              <div>
                <span id="resultMaintenance" class="text-slate-700 py-0.5"></span>
                <p class="text-slate-500 text-xs mt-1 ml-1" id="resultNotes"></p>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3">
              <span class="inline-block px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs font-semibold whitespace-nowrap w-fit">血液透析(HD)時</span>
              <span id="resultHD" class="text-slate-700 py-0.5"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof antibioticsData === 'undefined') {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = 'エラー：データファイル（data.js）が読み込めませんでした。';
        errorDiv.classList.remove('hidden');
        return;
      }

      // 1. プルダウン生成
      const drugSelect = document.getElementById('drugSelect');
      const categorizedDrugs = {};
      antibioticsData.forEach(drug => {
        if (!categorizedDrugs[drug.category]) categorizedDrugs[drug.category] = [];
        categorizedDrugs[drug.category].push(drug);
      });

      Object.keys(categorizedDrugs).forEach(category => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = category;
        categorizedDrugs[category].forEach(drug => {
          const option = document.createElement('option');
          option.value = drug.drug_id;
          option.textContent = drug.drug_name;
          optgroup.appendChild(option);
        });
        drugSelect.appendChild(optgroup);
      });

      // 照合用辞書（平坦化）
      const candidateList = [];
      antibioticsData.forEach(drug => {
        candidateList.push({ id: drug.drug_id, targetText: toKatakana(drug.drug_name) });
        if (drug.aliases && Array.isArray(drug.aliases)) {
          drug.aliases.forEach(alias => {
            candidateList.push({ id: drug.drug_id, targetText: toKatakana(alias) });
          });
        }
      });

      function toKatakana(src) {
        return src
          .replace(/[ぁ-ん]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60))
          .toUpperCase();
      }

      function levenshteinDistance(s1, s2) {
        const len1 = s1.length;
        const len2 = s2.length;
        const d = [];
        for (let i = 0; i <= len1; i++) d[i] = [i];
        for (let j = 0; j <= len2; j++) d[0][j] = j;

        for (let i = 1; i <= len1; i++) {
          for (let j = 1; j <= len2; j++) {
            const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
            d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
          }
        }
        return d[len1][len2];
      }

      function findBestMatch(fullText, targetWord) {
        const targetLen = targetWord.length;
        if (targetLen === 0) return 0;
        let maxScore = 0;
        const minWindow = Math.max(1, targetLen - 1);
        const maxWindow = targetLen + 1;

        for (let w = minWindow; w <= maxWindow; w++) {
          for (let i = 0; i <= fullText.length - w; i++) {
            const sub = fullText.substr(i, w);
            const dist = levenshteinDistance(sub, targetWord);
            const score = 1 - dist / Math.max(sub.length, targetLen);
            if (score > maxScore) {
              maxScore = score;
              if (maxScore === 1.0) return 1.0;
            }
          }
        }
        return maxScore;
      }

      function matchDrugByFuzzy(inputText) {
        const normalizedInput = toKatakana(inputText);
        let bestDrugId = null;
        let highestScore = 0;

        candidateList.forEach(cand => {
          const score = findBestMatch(normalizedInput, cand.targetText);
          if (score > highestScore) {
            highestScore = score;
            bestDrugId = cand.id;
          }
        });
        return highestScore >= 0.65 ? bestDrugId : null;
      }

      function normalizeText(text) {
        let t = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
        t = t.replace(/点/g, '.');
        t = t.replace(/(\d\.\d)(\d+)/g, '$1 $2');
        return t;
      }

      // 2. 自動計算ロジック
      function checkAndCalculate() {
        const age = parseFloat(document.getElementById('age').value);
        const gender = document.getElementById('gender').value;
        const weight = parseFloat(document.getElementById('weight').value);
        const cr = parseFloat(document.getElementById('creatinine').value);
        const drugId = document.getElementById('drugSelect').value;
        const resultArea = document.getElementById('resultArea');

        if (!age || !gender || !weight || !cr || !drugId) {
          resultArea.classList.add('hidden');
          return;
        }

        let ccr = ((140 - age) * weight) / (72 * cr);
        if (gender === 'female') ccr = ccr * 0.85;
        ccr = Math.round(ccr * 10) / 10;

        const drug = antibioticsData.find(d => d.drug_id === drugId);
        const guideline = drug.dosing_guidelines.find(g => ccr >= g.min_ccr && ccr < g.max_ccr);

        document.getElementById('resultCcr').textContent = ccr;
        document.getElementById('resultDrugName').textContent = drug.drug_name;
        document.getElementById('resultLoading').textContent = drug.loading_dose;
        document.getElementById('resultHD').textContent = drug.hd_dose;

        if (guideline) {
          document.getElementById('resultMaintenance').textContent = `${guideline.dose} / ${guideline.interval}`;
          document.getElementById('resultNotes').textContent = guideline.notes ? `※ ${guideline.notes}` : '';
        } else {
          document.getElementById('resultMaintenance').textContent = "該当する用量基準がありません";
          document.getElementById('resultNotes').textContent = "";
        }

        resultArea.classList.remove('hidden');
      }

      document.querySelectorAll('.trigger-calc').forEach(el => {
        el.addEventListener('input', checkAndCalculate);
        el.addEventListener('change', checkAndCalculate);
      });

      // 3. 音声認識テキストのパラメーター解析処理
      function processVoiceTranscript(text) {
        const normalizedText = normalizeText(text);

        const ageMatch = normalizedText.match(/(\d{1,3})\s*(?:歳|才)/);
        const genderMatch = normalizedText.match(/(男|女)/);
        const weightMatch = normalizedText.match(/(\d{1,3}(?:\.\d+)?)\s*(?:キロ|KG|ＫＧ)/i);
        const crMatch = normalizedText.match(/(?:クレアチニン|CRE|CR)[^\d]*(\d{1,2}(?:\.\d{1})?)/i);

        if(ageMatch) document.getElementById('age').value = ageMatch[1];
        if(genderMatch) document.getElementById('gender').value = genderMatch[1] === '男' ? 'male' : 'female';
        if(weightMatch) document.getElementById('weight').value = weightMatch[1];
        if(crMatch) document.getElementById('creatinine').value = crMatch[1];

        if (text.trim().length >= 2) {
          const matchedId = matchDrugByFuzzy(text);
          if (matchedId) {
            document.getElementById('drugSelect').value = matchedId;
          }
        }

        checkAndCalculate();
      }

      // 4. 音声認識（Web Speech API）制御
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const micBtn = document.getElementById('micBtn');
      const micIcon = document.getElementById('micIcon');
      const micText = document.getElementById('micText');
      const transcriptPreview = document.getElementById('transcriptPreview');

      if (!SpeechRecognition) {
        micBtn.classList.replace('bg-blue-600', 'bg-slate-400');
        micBtn.classList.add('cursor-not-allowed');
        micText.textContent = "音声認識非対応のブラウザです";
        micBtn.disabled = true;
      } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = false;

        let isListening = false;

        function setListeningState(active) {
          isListening = active;
          if (active) {
            micBtn.className = "w-full py-4 px-6 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-base animate-pulse";
            micIcon.textContent = "⏹️";
            micText.textContent = "聞き取り中...（話しかけてください）";
            transcriptPreview.textContent = "音声を聞き取っています...";
            transcriptPreview.classList.add('text-blue-600', 'font-semibold');
          } else {
            micBtn.className = "w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-base";
            micIcon.textContent = "🎙️";
            micText.textContent = "タップして音声入力";
            transcriptPreview.classList.remove('text-blue-600', 'font-semibold');
          }
        }

        micBtn.addEventListener('click', () => {
          if (isListening) {
            recognition.stop();
          } else {
            try {
              recognition.start();
              setListeningState(true);
            } catch (err) {
              console.error("マイク起動エラー:", err);
            }
          }
        });

        recognition.onresult = (event) => {
          let currentText = '';
          for (let i = 0; i < event.results.length; i++) {
            currentText += event.results[i][0].transcript;
          }
          transcriptPreview.textContent = `認識中: "${currentText}"`;
          processVoiceTranscript(currentText);
        };

        recognition.onend = () => {
          setListeningState(false);
        };

        recognition.onerror = (event) => {
          console.warn("音声認識エラー:", event.error);
          transcriptPreview.textContent = "音声認識が中断されました。再度お試しください。";
          setListeningState(false);
        };
      }
    });
  </script>
</body>
</html>
